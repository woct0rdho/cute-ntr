[pytest]
markers =
    sm120: tests that must execute on the RTX 5090 (release gate — never skipped silently)
    sm86: tests that must execute on an NVIDIA compute capability 8.6 device
    wip: work-in-progress (never counted as PASS; runs explicitly via -m wip)
    perf: performance-suite smoke regressions (run explicitly via -m perf)
testpaths = tests
addopts = -m 'not wip and not perf'
